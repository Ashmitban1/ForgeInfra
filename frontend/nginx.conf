server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Re-resolve the service after Compose recreates the backend container.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream backend:8000;

    location = /ready {
        access_log off;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://$api_upstream$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
